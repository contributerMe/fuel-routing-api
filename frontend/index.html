<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Routing Optimization</title>
    
    <!-- Tailwind CSS (CDN for simplicity) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS for Mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#3b82f6',
                        dark: '#0f172a'
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row bg-slate-50 text-slate-800 overflow-hidden font-sans">
    
    <!-- Sidebar -->
    <aside class="w-full md:w-[400px] h-1/2 md:h-full bg-white shadow-2xl flex flex-col z-20">
        <div class="p-6 bg-gradient-to-br from-blue-600 to-indigo-700 text-white shadow-md">
            <h1 class="text-2xl font-bold tracking-tight mb-2">Fuel Optimizer</h1>
            <p class="text-blue-100 text-sm">Calculate the most cost-effective fueling strategy for your road trip.</p>
        </div>
        
        <!-- Form -->
        <div class="p-6 border-b border-slate-100">
            <form id="routeForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Start Location</label>
                    <input type="text" id="startInput" placeholder="e.g., Los Angeles, CA" required
                        class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Finish Location</label>
                    <input type="text" id="finishInput" placeholder="e.g., Chicago, IL" required
                        class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-lg hover:shadow-xl transition-all flex justify-center items-center">
                    <span>Calculate Route</span>
                </button>
            </form>
        </div>

        <!-- Loading State -->
        <div id="loadingIndicator" class="hidden p-8 flex-col items-center justify-center flex-1">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-slate-500 font-medium">Crunching optimization algorithms...</p>
        </div>

        <!-- Results Area -->
        <div id="resultsArea" class="hidden flex-1 overflow-y-auto flex flex-col">
            <!-- Stats Summary -->
            <div class="p-6 bg-slate-50 grid grid-cols-2 gap-4 border-b border-slate-200">
                <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-100 text-center">
                    <p class="text-xs text-slate-500 font-semibold uppercase">Total Distance</p>
                    <p class="text-lg font-bold text-slate-800" id="totalDist">0 mi</p>
                </div>
                <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-100 text-center">
                    <p class="text-xs text-slate-500 font-semibold uppercase">Total Fuel Cost</p>
                    <p class="text-lg font-bold text-green-600" id="totalCost">$0.00</p>
                </div>
            </div>
            
            <!-- Stops List -->
            <div class="p-6">
                <h3 class="text-sm font-bold text-slate-800 mb-4 uppercase tracking-wider">Required Fuel Stops</h3>
                <div id="stopsList" class="space-y-4">
                    <!-- Stops will be injected here -->
                </div>
            </div>
        </div>
        
        <!-- Error Message -->
        <div id="errorArea" class="hidden p-6 text-center text-red-500 font-medium flex-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto mb-2 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <p id="errorMsg"></p>
        </div>
    </aside>

    <!-- Map Area -->
    <main class="flex-1 h-1/2 md:h-full relative z-10 bg-slate-200" id="map">
        <!-- Leaflet Map mounts here -->
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
